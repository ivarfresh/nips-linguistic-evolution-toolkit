  trust_game_later_trustee_with_shared_context: '{shared_context_block}Round {turn}


    You are the TRUSTEE this round. {investor_name} has sent you ${received} this round. How much do you return to {investor_name}? (0-{received})

    '
  myth_writing_default_with_shared_context: '{shared_context_block}Write a myth about {myth_topic}. Write 200 words.

    '
  myth_writing_later_rounds_with_shared_context: '{shared_context_block}Write your own myth for this round. Use the shared context above as inspiration, but adapt it in your own way.

    Keep the myth about {myth_topic}. Write 200 words. Format exactly:

    Myth: [your story here].

    '
  trust_game_default: 'You are an agent participating in a multi-task experiment. You will play a game and may also be asked to write myths.


    GAME:

    You will play different roles across multiple rounds.


    When you are the SENDER:

