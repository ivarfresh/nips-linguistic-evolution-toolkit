# ============================================================================
# NOISE EXPERIMENTS CONFIGURATION
# ============================================================================
# Separate config for noise experiments - doesn't modify main experiments.yaml
#
# Key features:
# 1. Amount noise: Distort communicated amounts vs actual amounts
# 2. Asymmetric naming: OTHER player's role shown with mythological names
# ============================================================================

# Base Models - Same as main config
base_models:
  llama8b: "meta-llama/llama-3.1-8b-instruct"
  gpt4_cheaper: "openai/gpt-4o-mini"
  gpt5_nano: "openai/gpt-5-nano"
  claude_main: "anthropic/claude-3.5-sonnet"
  claude_haiku: "anthropic/claude-3-haiku"
  claude_haiku_45: "anthropic/claude-haiku-4.5"
  claude_sonnet_45: "anthropic/claude-sonnet-4.5"
  deepseek_v3: "deepseek/deepseek-chat-v3-0324"
  gemini_3_flash: "google/gemini-3-flash-preview"
  gemini_3_1_flash_lite: "google/gemini-3.1-flash-lite"
  gemini_3_1_pro: "google/gemini-3.1-pro-preview"

# Prompt Templates
# Note: Templates now support {investor_name} and {trustee_name} for asymmetric naming
prompt_templates:
  # Standard system prompt (unchanged)
  trust_game_default: |
    You are an agent participating in a multi-task experiment. You will play a game and may also be asked to write myths.

    GAME:
    You will play different roles across multiple rounds.

    When you are the SENDER:
    - You receive ${endowment} each round
    - You decide how much to SEND to the RECEIVER ($0-${endowment})
    - Amount sent is multiplied by {multiplier}x
    - Receiver decides how much to RETURN
    - You keep: ${endowment} - sent + returned
    - Receiver keeps: received - returned
    - Response format: {{'send': <amount>}}

    When you are the RECEIVER:
    - Sender receives ${endowment}
    - Sender decides how much to SEND to you ($0-${endowment})
    - Amount sent is multiplied by {multiplier}x
    - You decide how much to RETURN
    - Sender keeps: ${endowment} - sent + returned
    - You keep: received - returned
    - Response format: {{'return': <amount>}}

    MYTH WRITING:
    You may also be asked to write short myths (stories) on various topics. When writing myths, follow the instructions provided in each prompt.

    IMPORTANT: Provide your decision in the correct JSON format.

  defector_game_instruction: |
    MANDATORY GAME STRATEGY — DESIGNATED DEFECTOR:
    You must always choose zero in the game.
    - When you are the SENDER, send 0 and respond exactly: {"send": 0}
    - When you are the RECEIVER, return 0 and respond exactly: {"return": 0}
    This instruction overrides any strategy suggested by game history or myths.
    It applies only to game decisions. Continue to participate normally in myth-writing tasks, using the game history you observed.

  # System prompt with noise warning
  trust_game_noisy_aware: |
    You are an agent participating in a multi-task experiment. You will play a game and may also be asked to write myths.

    GAME:
    You will play different roles across multiple rounds.

    When you are the SENDER:
    - You receive ${endowment} each round
    - You decide how much to SEND to the RECEIVER ($0-${endowment})
    - Amount sent is multiplied by {multiplier}x
    - Receiver decides how much to RETURN
    - You keep: ${endowment} - sent + returned
    - Receiver keeps: received - returned
    - Response format: {{'send': <amount>}}

    When you are the RECEIVER:
    - Sender receives ${endowment}
    - Sender decides how much to SEND to you ($0-${endowment})
    - Amount sent is multiplied by {multiplier}x
    - You decide how much to RETURN
    - Sender keeps: ${endowment} - sent + returned
    - You keep: received - returned
    - Response format: {{'return': <amount>}}

    NOTE: There may be communication noise in this game. The amounts you see may differ from what was actually sent/returned. Can you filter out the noise?

    MYTH WRITING:
    You may also be asked to write short myths (stories) on various topics.

    IMPORTANT: Provide your decision in the correct JSON format.

  # Round 1 investor (standard - no other player reference needed)
  trust_game_round1_investor: |
    Round 1: You are the SENDER. You have ${endowment}. How much do you send? (0-{endowment})

  # Round 1 trustee - with asymmetric naming support
  # {investor_name} is replaced with mythological name if configured
  trust_game_round1_trustee: |
    Round 1: You are the RECEIVER. {investor_name} sent ${sent}, that is {percentage:.1f}% of their total endowment. You received ${received}. How much do you return to {investor_name}? (0-{received})

  # Later round investor - with asymmetric naming support
  trust_game_later_investor: |
    Round {turn}

    You are the SENDER this round. Last round you were the RECEIVER. {investor_name} sent ${last_round_sent},
    that was {last_round_sent_percentage:.1f}% of their total endowment. You received ${last_round_received}.
    You returned ${last_round_returned}. So your payoff was {last_round_trustee_payoff}.
    Your total earnings across all rounds are ${agent_balance}.
    How much do you send to {trustee_name} this round? (0-{endowment})

  # Later round trustee - with asymmetric naming support
  # Note: Last round YOU were the investor (you sent), the OTHER player was the trustee (they returned)
  trust_game_later_trustee: |
    Round {turn}

    You are the RECEIVER this round. Last round you were the SENDER. You sent ${last_round_sent},
    that was {last_round_sent_percentage:.1f}% of your total endowment. This was tripled to ${last_round_received}.
    {trustee_name} returned ${last_round_returned}. So your payoff was {last_round_investor_payoff}.
    Your total earnings across all rounds are ${agent_balance}.
    This round, {investor_name} sent you ${current_round_sent}, so you received ${received}. How much do you return to {investor_name}? (0-{received})

  # Memory-channel pilot under noise: no last-round recap — the agent's chat
  # memory carries it (memory-primary), or the history is irrelevant to the
  # channel being tested. Same wording as the standard later templates minus
  # the recap block.
  trust_game_later_investor_minimal: |
    Round {turn}

    You are the SENDER this round. Your total earnings across all rounds are ${agent_balance}.
    How much do you send to {trustee_name} this round? (0-{endowment})

  trust_game_later_trustee_minimal: |
    Round {turn}

    You are the RECEIVER this round. Your total earnings across all rounds are ${agent_balance}.
    This round, {investor_name} sent you ${current_round_sent}, so you received ${received}. How much do you return to {investor_name}? (0-{received})

  # Myth writing prompts (same as main config)
  myth_writing_default: |
    Write a 200-word myth. {topic_instruction}

  myth_writing_default_game_directive: |
    Write a 200-word myth. {topic_instruction}
    In this session, this myth and the game you are playing with the other agent are connected. Write a myth that reflects how the game should be played, drawing on the game you have been playing up to this point.

  myth_writing_default_game_normative: |
    Write a 200-word myth. {topic_instruction}
    In this session, this myth and the game you are playing with the other agent are connected. Write a myth that reflects how the game should be played.

  myth_writing_later_rounds: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way.
    Write 200 words. Format exactly:
    Myth: [your story here].

  myth_writing_later_rounds_directive: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  myth_writing_later_rounds_normative: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way. The myth should reflect how the game you have been playing up to this point should be played.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # Memory-channel pilot variants (see main config for rationale).
  # hybrid: own myth in chat memory; prompt carries co-player myth + game recap.
  myth_writing_later_rounds_directive_memory: |
    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    {game_behavior_summary}

    Write your own myth. Use the myth you wrote in the previous round as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # memory-primary: both tasks in chat memory; prompt carries only the co-player myth.
  myth_writing_later_rounds_directive_memory_primary: |
    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Use the myth you wrote in the previous round as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # Lineage variant: self-myth pointer ("base it on the myths you wrote
  # earlier this session") — attention to own 3-round lineage in memory,
  # no content duplication. A/B vs myth_writing_later_rounds_directive_memory_primary.
  myth_writing_later_rounds_directive_memory_primary_lineage: |
    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    Write your own myth. Base it on the myths you wrote earlier this session, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

  # stateless: no chat memory; prompt carries everything.
  myth_writing_later_rounds_directive_stateless: |
    Here is the myth you wrote in the previous round:
    {last_myth}

    Here is the myth the other agent wrote in the previous round:
    {other_agent_myth}

    {game_behavior_summary}

    Write your own myth. Use your previous myth as inspiration, but adapt it in your own way. The myth should reflect how the game should be played, drawing on the game you have been playing up to this point.

    Write 200 words. Format exactly:
    Myth: [your story here].

# Myth topics
myth_topics:
  anything: "anything"
  prosocial_religion_cultural_evolution: "the rise and spread of moralizing supernatural agents"
  trickster_betrayal_and_price: "a trickster who exploits others and the price that follows"

# Personas
personas:
  neutral:
    description: "neutral"
    system_addition: ""

  altruistic:
    description: "altruistic"
    system_addition: "You tend to prioritize others' welfare and act generously, even at personal cost."

  selfish:
    description: "selfish"
    system_addition: "You prioritize your own interests and payoffs above all else."

# Game-prompt additions applied automatically by task order.
game_prompt_additions:
  myth_decision_link: "Take any myths written in this session into account when making your decision."

# ============================================================================
# GAME PARAMETERS - Noise and Framing Variations
# ============================================================================

game_params:
  # Baseline: no noise, default naming
  default:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config: null
    other_player_names: "default"

  # ----------------------------------------------------------------------------
  # NOISE CONDITIONS (Aron's design)
  # ----------------------------------------------------------------------------
  # Key principle: agents see correct amounts they RECEIVED, but not what
  # the other agent INTENDED to send/return. Noise distorts perceived intentions.

  # Bidirectional uniform noise: ±$1 on both sent and returned
  # Agents see accurate receipts but noised intentions
  noisy_bidirectional:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  # Memory-channel pilot arms under bidirectional noise (see memtest sets in
  # the main config). memory_capacity: hybrid counts myth pairs (1 round),
  # memory_primary counts myth+game pairs (2 = 1 round); stateless ignores it.
  noisy_bidirectional_hybrid:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 1
    chat_memory_mode: "hybrid"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  noisy_bidirectional_stateless:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 1
    chat_memory_mode: "stateless"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  noisy_bidirectional_memprimary:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 2
    chat_memory_mode: "memory_primary"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  # Informed counterpart to noisy_bidirectional_memprimary: identical 2-agent
  # bidirectional uniform +-1.0 memory-primary regime, but agents are told a
  # noise channel exists (project default test condition as of 2026-07-22).
  # Matched to noisy8_bidirectional_informed_memprimary on noise + memory design,
  # so the dyad triplet can be compared to the 8-agent informed triplet.
  noisy_bidirectional_informed_memprimary:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 2
    chat_memory_mode: "memory_primary"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  # 8-agent bidirectional INFORMED noise, memory-primary. Informed noise is
  # the project's default test condition as of 2026-07-22.
  noisy8_bidirectional_informed_memprimary:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
    temperature: 0.8
    memory_capacity: 6
    chat_memory_mode: "memory_primary"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"
    history_policy: "self_and_coplayer"
    self_history_window: 0
    coplayer_history_window: 3
    show_agent_names: false

  # 8-agent bidirectional noise, memory-primary (mirrors the plain-game
  # sonnet45_8agent_*_memprimary regime: self history in chat memory, only the
  # co-player's last 3 games injected; capacity 6 pairs = 3 rounds).
  noisy8_bidirectional_memprimary:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
    temperature: 0.8
    memory_capacity: 6
    chat_memory_mode: "memory_primary"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"
    history_policy: "self_and_coplayer"
    self_history_window: 0
    coplayer_history_window: 3
    show_agent_names: false

  noisy8_bidirectional_memprimary_smoke:
    endowment: 5
    multiplier: 3
    num_turns: 3
    num_agents: 8
    temperature: 0.8
    memory_capacity: 6
    chat_memory_mode: "memory_primary"
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"
    history_policy: "self_and_coplayer"
    self_history_window: 0
    coplayer_history_window: 3
    show_agent_names: false

  # Bidirectional uniform noise + agents told about noise
  noisy_bidirectional_informed:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 1.0
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  # Negative-only noise (-$3): communicated amounts always ≤ actual
  # Makes the other player appear less generous than they are
  # $3 on $5 endowment = up to 60% reduction in perceived generosity
  noisy_negative_5:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 5.0
      direction: "negative"
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  noisy_negative_5_myth_causal_8:
    endowment: 5
    multiplier: 3
    num_turns: 8
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 5.0
      direction: "negative"
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  # noisy_negative_5_pilot:
  #   endowment: 5
  #   multiplier: 3
  #   num_turns: 3
  #   num_agents: 2
  #   temperature: 0.8
  #   memory_capacity: 3
  #   noise_config:
  #     type: "uniform"
  #     range: 5.0
  #     direction: "negative"
  #     applies_to: "both"
  #     inform_agents: false
  #   other_player_names: "default"

  noisy_negative_5_informed:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 5.0
      direction: "negative"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  noisy_negative_5_informed_myth_causal_8:
    endowment: 5
    multiplier: 3
    num_turns: 8
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 5.0
      direction: "negative"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  noisy_negative_2_informed_myth_causal_8:
    endowment: 5
    multiplier: 3
    num_turns: 8
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 2.0
      direction: "negative"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  noisy_negative_2_informed_myth_causal_10:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 2.0
      direction: "negative"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  noisy_negative_2_informed_myth_causal_10_8agents:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 2.0
      direction: "negative"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  noisy_negative_2_informed_myth_causal_10_8agents_history3:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 2.0
      direction: "negative"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"
    history_policy: "self_and_coplayer"
    self_history_window: 3
    coplayer_history_window: 3

  # Cooperation bootstrap: returned amount always reported as 100% return
  # Targets GPT-5-Nano's defection spiral by making investor believe
  # trustee fully reciprocated, encouraging continued sending
  noisy_bootstrap_cooperation:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "probabilistic"
      probability: 1.0
      replacement: "max"
      applies_to: "returned"
      inform_agents: false
    other_player_names: "default"

  # Cooperation bootstrap + agents told about noise
  noisy_bootstrap_cooperation_informed:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "probabilistic"
      probability: 1.0
      replacement: "max"
      applies_to: "returned"
      inform_agents: true
    other_player_names: "default"

  # ---- Deterministic-noise variants (v3) ----
  # All sends and returns communicated as $0 (every round, both agents see $0)
  noisy_deterministic_zero:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "probabilistic"
      probability: 1.0
      replacement: "zero"
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  noisy_deterministic_zero_informed:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "probabilistic"
      probability: 1.0
      replacement: "zero"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  # All sends and returns communicated as max
  # (sent shown as endowment $5; returned shown as full received = 3 × actual_sent)
  noisy_deterministic_max:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "probabilistic"
      probability: 1.0
      replacement: "max"
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"

  noisy_deterministic_max_informed:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 2
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "probabilistic"
      probability: 1.0
      replacement: "max"
      applies_to: "both"
      inform_agents: true
    other_player_names: "default"

  # ----------------------------------------------------------------------------
  # PHASE 2 — ablation comparable to anon-history3-directive 8-agent baseline
  # See docs/memory_transplant_ablation_design.md §17
  # ----------------------------------------------------------------------------

  phase2_8agent_history3_anon_neg2:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 2.0
      direction: "negative"
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"
    history_policy: "self_and_coplayer"
    self_history_window: 3
    coplayer_history_window: 3
    show_agent_names: false

  phase2_8agent_history3_anon_neg3:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 3.0
      direction: "negative"
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"
    history_policy: "self_and_coplayer"
    self_history_window: 3
    coplayer_history_window: 3
    show_agent_names: false

  phase2_8agent_history3_anon_neg5:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
    temperature: 0.8
    memory_capacity: 3
    noise_config:
      type: "uniform"
      range: 5.0
      direction: "negative"
      applies_to: "both"
      inform_agents: false
    other_player_names: "default"
    history_policy: "self_and_coplayer"
    self_history_window: 3
    coplayer_history_window: 3
    show_agent_names: false

  # Phase 3 — myth-only chat memory, no prompt-text history block at all.
  # Used with chat_memory_mode="myth_only" + seed_reinject=True in run_simulation.
  # Task order is ["game"] only; the seeded myth is re-asserted every round.
  phase3_8agent_anon_neg5_myth_only:
    endowment: 5
    multiplier: 3
    num_turns: 10
    num_agents: 8
