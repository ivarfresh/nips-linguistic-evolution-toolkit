# OpenRouter has no dated cost history older than 30 days in its API. Spend
# paid from OpenRouter credits up to `fixed_until` was read from the Activity
# page (metric "Credits Usage"); BYOK traffic is excluded because Anthropic and
# OpenAI bill it and it is already counted above. Later spend is the growth in
# the account's lifetime credit usage (/api/v1/credits) since `snapshot`.
openrouter:
  fixed_until: "2026-10-01"
  fixed_usd_by_month:
    2026-01: 24.84
    2026-02: 92.08
    2026-03: 46.00
    2026-04: 119.11
    2026-05: 24.25
    2026-06: 0.00
    2026-07: 8.93
    2026-08: 3.78
    2026-09: 21.78
  snapshot: null   # set with: python scripts/grant_budget.py --snapshot-openrouter

# Google has no cost API without a BigQuery billing export. Refresh by hand from
