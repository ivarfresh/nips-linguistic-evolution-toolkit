# ─────────────────────────────────────────────────────────────────────
# SECTION 2 — New experiment_sets
# ─────────────────────────────────────────────────────────────────────

  # ------------ A3 — Forced reasoning prose (4 noise conditions) ------------

  # GPT-5-Nano with forced reasoning prose. 3 task orders × 4 noise
  # conditions × 10 seeds ≈ 120 runs.
  gpt5nano_forced_reasoning:
    models: ["gpt5_nano"]
    templates: ["trust_game_noisy_aware_with_reasoning"]
    personas: ["neutral"]
    task_orders: [["game"], ["game", "myth"], ["myth", "game"]]
    myth_topics: ["anything"]
    game_params_list:
      - "noisy_positive_5"
      - "noisy_positive_5_informed"
      - "noisy_negative_5"
      - "noisy_bootstrap_cooperation"
    num_runs: 10

  # ------------ A1 — Partner-myth injection (4 noise conditions) ------------

  # GPT-5-Nano with partner-myth injected into the game prompt. Skips
  # the game-only task order (no partner myth to inject without a myth
  # task in the cycle). Uses the new round_prompt_templates set.
  gpt5nano_partner_myth_injection:
    models: ["gpt5_nano"]
    templates: ["trust_game_default"]   # base system prompt (no reasoning forcing)
    personas: ["neutral"]
    task_orders: [["game", "myth"], ["myth", "game"]]
    myth_topics: ["anything"]
    game_params_list:
      - "noisy_positive_5"
      - "noisy_positive_5_informed"
      - "noisy_negative_5"
      - "noisy_bootstrap_cooperation"
    num_runs: 15
    # Override the default round-prompt templates to use the
    # partner-myth-injection variants.
    round_prompt_templates:
      round1_investor: "trust_game_round1_investor_with_partner_myth"
      round1_trustee: "trust_game_round1_trustee_with_partner_myth"
      later_investor: "trust_game_later_investor_with_partner_myth"
      later_trustee: "trust_game_later_trustee_with_partner_myth"

  # ------------ A1+A3 combined — Partner-myth injection + forced reasoning -

  # If you want the cleanest test where the game prompt has the partner's
  # myth AND the agent emits prose. Slightly more runs but most informative.
  gpt5nano_partner_myth_plus_reasoning:
    models: ["gpt5_nano"]
    templates: ["trust_game_noisy_aware_with_reasoning"]
    personas: ["neutral"]
    task_orders: [["game", "myth"], ["myth", "game"]]
    myth_topics: ["anything"]
    game_params_list:
      - "noisy_positive_5"
      - "noisy_positive_5_informed"
      - "noisy_negative_5"
      - "noisy_bootstrap_cooperation"
    num_runs: 10
    round_prompt_templates:
      round1_investor: "trust_game_round1_investor_with_partner_myth"
      round1_trustee: "trust_game_round1_trustee_with_partner_myth"
      later_investor: "trust_game_later_investor_with_partner_myth"
      later_trustee: "trust_game_later_trustee_with_partner_myth"

  # ------------ Phase 5 — Targeted myth × bootstrap (mechanism test) -------

  # The §5.2 mechanism-discriminating test. The current finding is that
  # GPT-5-Nano × bootstrap shows myth destabilization (mean -7 to -10,
  # variance up 5×–8×). The "competing prior" interpretation predicts:
  # if the myth content is itself COOPERATIVE (the reciprocity_oath topic),
  # it should compete EVEN HARDER with bootstrap noise's contradictory
  # signal — making things worse, not better. If instead targeted-cooperative
  # myth RESCUES the destabilization, the mechanism story is wrong and we
  # have a different, more interesting interpretation.
  #
  # 4 cells × 15 seeds = 60 runs.
  targeted_myth_bootstrap_gpt5nano:
    models: ["gpt5_nano"]
    templates: ["trust_game_noisy_aware"]
    personas: ["neutral"]
    task_orders: [["game"], ["game", "myth"], ["myth", "game"]]
    myth_topics: ["reciprocity_oath"]
    game_params_list:
      - "noisy_bootstrap_cooperation"
      - "noisy_bootstrap_cooperation_informed"
    num_runs: 15

  # ------------ A2 — Self-myth recall (post-A1 follow-up) ------------------

  # If A1 (partner-myth) doesn't lift cooperation, A2 tests the within-agent
  # variant: quote the agent's OWN previous myth in the game prompt instead
  # of the partner's. Discriminates internal-anchoring from social-perception
  # mechanisms. Currently NOT in the overnight queue — uncomment in
  # overnight_queue.sh Phase 6 if Phase 1 (A1) finishes early.
